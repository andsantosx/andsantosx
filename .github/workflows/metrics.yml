name: Metrics
on:
  # Roda a cada 24 horas
  schedule: [{cron: "0 0 * * *"}]
  # Permite rodar manualmente ou em cada push (opcional, pode ser comentado)
  workflow_dispatch:
  push: {branches: ["master", "main"]}
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          # Usa o token nativo das actions (não precisa configurar secret)
          token: ${{ secrets.GITHUB_TOKEN }}
          
          # Configurações básicas (Removidas seções poluídas)
          user: andsantosx
          template: classic
          base: header, repositories
          config_timezone: America/Sao_Paulo
          config_transparent: yes
          
          # Plugin Isocalendar (Calendário 3D)
          plugin_isocalendar: yes
          plugin_isocalendar_main: yes
          
          # Plugin de Linhas de Código (Produtividade)
          plugin_lines: yes
          plugin_lines_history_limit: 1
          plugin_lines_repositories_limit: 4
          plugin_lines_sections: base
          
          # Linguagens mais usadas
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 14
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          
          # Ordem de exibição dos painéis
          config_order: base.header, isocalendar, languages, lines, base.repositories
